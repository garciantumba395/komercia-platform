<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Console{% endblock %} – Komersia exploitation</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;color:#1c1f23;background:#f5f6f8}
  header{background:#1c2733;color:#fff;padding:.7rem 1.2rem;display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
  header a{color:#cfe3ff;text-decoration:none} header .sp{flex:1}
  header form{margin:0} header button{background:none;border:1px solid #6b7b8c;color:#fff;padding:.25rem .6rem;border-radius:4px;cursor:pointer}
  main{max-width:1100px;margin:1.2rem auto;padding:0 1rem}
  h1{font-size:1.4rem} h2{font-size:1.1rem;margin-top:1.6rem}
  table{border-collapse:collapse;width:100%;background:#fff} th,td{border:1px solid #dde1e6;padding:.4rem .6rem;text-align:left;font-size:.92rem}
  th{background:#eef1f5} .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.8rem}
  .tile{background:#fff;border:1px solid #dde1e6;border-radius:6px;padding:.8rem} .tile b{display:block;font-size:1.5rem}
  .badge{display:inline-block;padding:.05rem .5rem;border-radius:10px;font-size:.8rem;background:#e3e8ee}
  .bad{background:#fbd9d9} .good{background:#d8f1de}
  .msg{padding:.6rem .8rem;border-radius:4px;margin:.6rem 0;background:#e3f0ff} .msg.error{background:#fbd9d9}
  form.card,.card{background:#fff;border:1px solid #dde1e6;border-radius:6px;padding:1rem;margin:.8rem 0}
  input,select,textarea{font:inherit;padding:.3rem;max-width:100%} textarea{width:100%;box-sizing:border-box}
  button.primary{background:#1c5fd4;color:#fff;border:0;padding:.45rem .9rem;border-radius:4px;cursor:pointer}
  button.danger{background:#b42318;color:#fff;border:0;padding:.45rem .9rem;border-radius:4px;cursor:pointer}
  .muted{color:#667} .nowrap{white-space:nowrap}
</style>
</head>
<body>
<header>
  <strong>Komersia – exploitation</strong>
  {% if request.user.is_authenticated %}
  <a href="{% url 'ops:dashboard' %}">Indicateurs</a>
  <a href="{% url 'ops:tenant_list' %}">Entreprises</a>
  <span class="sp"></span>
  <span>{{ request.user.full_name }}</span>
  <form method="post" action="{% url 'ops:logout' %}">{% csrf_token %}<button type="submit">Se déconnecter</button></form>
  {% endif %}
</header>
<main>
{% for message in messages %}<div class="msg {{ message.tags }}">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
</body>
</html>
