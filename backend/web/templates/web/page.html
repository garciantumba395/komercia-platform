{% extends "web/base.html" %}
{% block title %}{{ page_title }} – Komersia{% endblock %}
{% block body %}
{% if public %}
<main id="main" class="auth-wrap" tabindex="-1">
  <div class="auth-brand"><span class="logo" aria-hidden="true">K</span><span>Komersia</span></div>
  <div id="view" aria-live="polite">Chargement…</div>
</main>
{% else %}
<div class="shell">
  <header class="topbar">
    <button type="button" id="menu-toggle" class="btn btn-ghost menu-toggle" aria-expanded="false" aria-controls="sidenav">☰ Menu</button>
    <a class="brand" href="{% url 'web:home' %}"><span class="logo" aria-hidden="true">K</span><span>Komersia</span></a>
    <div class="topbar-info"><span id="store-slot"></span><span id="rate-chip" class="chip" hidden></span></div>
  </header>
  <nav id="sidenav" class="sidenav" aria-label="Navigation principale">
    <ul id="nav-list"></ul>
    <div class="nav-user">
      <div id="user-label"></div>
      <button type="button" id="logout" class="btn btn-ghost">Se déconnecter</button>
    </div>
  </nav>
  <div id="nav-backdrop" class="nav-backdrop"></div>
  <main id="main" class="content" tabindex="-1">
    <div id="sub-area" class="sub-area"><div id="sub-banner" class="sub-banner" role="status" hidden></div><div id="backup-banner" class="sub-banner" role="status" hidden></div></div>
    <h1 class="page-title">{{ page_title }}</h1>
    <div id="view" aria-live="polite">Chargement…</div>
  </main>
</div>
{% endif %}
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
{% endblock %}
